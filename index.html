<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Libo Racing</title>
<style>
:root{color-scheme:dark;box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b2a3a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
.b{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:92px;height:92px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:rgba(0,0,0,.35);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:none}
.b.on{background:rgba(255,255,255,.35)}
#brk{left:calc(env(safe-area-inset-left,0px) + 18px)}
#gas{right:calc(env(safe-area-inset-right,0px) + 18px)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,30,.7);color:#fff;text-align:center;gap:10px}
#ov h1{margin:0;font-size:34px}
#ov p{margin:0;opacity:.85}
#go{margin-top:8px;padding:14px 38px;font-size:20px;font-weight:700;border:0;border-radius:30px;background:#ffb300;color:#222}
</style></head><body>
<canvas id="c"></canvas>
<div class="b" id="brk">FRENO</div><div class="b" id="gas">GAS</div>
<div id="ov"><h1 id="t">Libo Racing</h1><p id="m">Tieni premuto GAS per salire le colline.<br>In aria, GAS inclina indietro e FRENO avanti.<br>Raccogli monete e carburante!</p><button id="go">Gioca</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,S,VW,VH;
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;W=cv.width;H=cv.height;S=Math.min(H/380,W/560);VW=W/S;VH=H/S}
addEventListener('resize',rs);rs();
const R=14,K=500,C=25,ENG=260,MU=1.2,I=2200;
const hh=x=>{const a=Math.min(1,Math.max(0,(x-250)/900))*(1+Math.min(x/8000,.8));return 330+a*(45*Math.sin(x/220)+22*Math.sin(x/90+1)+6*Math.sin(x/35+2))};
let c,camY,items,nextX,k,fuel,dist,cash,stall,run=false,gas=0,brk=0,best=0;
try{best=+localStorage.getItem('hrbest')||0}catch(e){}
function reset(){c={x:100,y:hh(100)-40,vx:0,vy:0,a:0,w:0};fuel=100;dist=0;cash=0;stall=0;items=[];nextX=500;k=0;camY=c.y-VH*.55}
function end(msg){if(!run)return;run=false;if(dist>best){best=dist;try{localStorage.setItem('hrbest',best)}catch(e){}}
document.getElementById('t').textContent=msg;document.getElementById('m').innerHTML='Distanza: <b>'+(dist|0)+' m</b> · Monete: <b>'+cash+'</b><br>Record: '+(best|0)+' m';document.getElementById('go').textContent='Riprova';document.getElementById('ov').style.display='flex'}
function step(dt,th,br){
let fx=0,fy=900,tq=0,touch=0;const ca=Math.cos(c.a),sa=Math.sin(c.a);
for(const bx of[-30,30]){const by=16,rx=ca*bx-sa*by,ry=sa*bx+ca*by,px=c.x+rx,py=c.y+ry,p=py+R-hh(px);
if(p>0){touch=1;const sl=(hh(px+1)-hh(px-1))/2,ln=Math.hypot(sl,1),nx=sl/ln,ny=-1/ln,tx=1/ln,ty=sl/ln;
const vx=c.vx-c.w*ry,vy=c.vy+c.w*rx,vn=vx*nx+vy*ny,vt=vx*tx+vy*ty;
const Fn=Math.min(20000,Math.max(0,K*p-C*vn));
let Ft=-.4*vt-br*8*vt;if(fuel>0&&vt<520)Ft+=th*ENG;
Ft=Math.max(-MU*Fn,Math.min(MU*Fn,Ft));
const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;fx+=Fx;fy+=Fy;tq+=rx*Fy-ry*Fx}}
if(!touch){tq+=(br-(fuel>0?th:0))*6000}
c.vx+=fx*dt;c.vy+=fy*dt;c.w+=tq/I*dt;c.w*=1-.6*dt;
c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.w*dt;
if(c.x<30){c.x=30;c.vx=0}
const hx=c.x+ca*4+sa*26,hy=c.y+sa*4-ca*26;
if(hy>hh(hx)-4)end('Ti sei ribaltato!')}
function after(d){
dist=Math.max(dist,(c.x-100)/10);
if(gas&&fuel>0)fuel-=2.6*d;
while(nextX<c.x+1600){k++;const f=k%9==0;items.push({x:nextX,y:hh(nextX)-35-(f?0:Math.random()*30),f,on:1});nextX+=170+Math.random()*80}
for(const i of items)if(i.on&&Math.hypot(i.x-c.x,i.y-c.y)<34){i.on=0;if(i.f)fuel=Math.min(100,fuel+40);else cash++}
items=items.filter(i=>i.on&&i.x>c.x-600);
if(fuel<=0&&Math.hypot(c.vx,c.vy)<15){stall+=d;if(stall>1.5)end('Carburante esaurito!')}else stall=0}
function draw(){
g.setTransform(1,0,0,1,0,0);g.fillStyle='#8fd3ff';g.fillRect(0,0,W,H);
g.setTransform(S,0,0,S,0,0);
const camX=c.x-VW*.25;camY+=(c.y-VH*.55-camY)*.1;
g.fillStyle='#bfe8ff';g.fillRect(0,0,VW,VH);
g.fillStyle='#7fb0cc';g.beginPath();g.moveTo(0,VH);for(let x=0;x<=VW+20;x+=20)g.lineTo(x,VH*.6+30*Math.sin((x+camX*.3)/120)-camY*.15);g.lineTo(VW+20,VH);g.fill();
g.fillStyle='#7a5230';g.beginPath();g.moveTo(0,VH+50);for(let x=-10;x<=VW+10;x+=10)g.lineTo(x,hh(x+camX)-camY);g.lineTo(VW+10,VH+50);g.fill();
g.strokeStyle='#4caf50';g.lineWidth=9;g.lineJoin='round';g.beginPath();for(let x=-10;x<=VW+10;x+=10){const y=hh(x+camX)-camY;x<-5?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
for(const i of items){const x=i.x-camX,y=i.y-camY;if(x<-20||x>VW+20)continue;
if(i.f){g.fillStyle='#e53935';g.fillRect(x-8,y-10,16,20);g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText('F',x,y+4)}
else{g.fillStyle='#ffc107';g.beginPath();g.arc(x,y,8,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=2;g.stroke()}}
g.save();g.translate(c.x-camX,c.y-camY);g.rotate(c.a);
g.fillStyle='#e53935';g.fillRect(-38,-8,76,22);g.fillStyle='#ef9a9a';g.fillRect(-10,-24,28,16);
g.fillStyle='#ffe0b2';g.beginPath();g.arc(4,-24,7,0,7);g.fill();
for(const bx of[-30,30]){g.save();g.translate(bx,16);g.rotate(c.x/R);g.fillStyle='#222';g.beginPath();g.arc(0,0,R,0,7);g.fill();g.fillStyle='#bbb';g.fillRect(-R+3,-1.5,2*R-6,3);g.restore()}
g.restore();
g.textAlign='left';g.fillStyle='#fff';g.font='bold 18px sans-serif';g.shadowColor='#0008';g.shadowBlur=4;
g.fillText((dist|0)+' m',16,28);g.fillText('🪙 '+cash,16,52);
g.shadowBlur=0;g.fillStyle='#0006';g.fillRect(VW-166,14,150,14);g.fillStyle=fuel>25?'#4caf50':'#e53935';g.fillRect(VW-166,14,Math.max(0,fuel)*1.5,14);
g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='right';g.fillText('CARBURANTE',VW-16,44)}
let last=0;
function loop(t){const d=Math.min(.033,(t-last)/1000||0);last=t;if(run){for(let i=0;i<4;i++)if(run)step(d/4,gas,brk);if(run)after(d)}draw();requestAnimationFrame(loop)}
function bind(id,set){const e=document.getElementById(id);
e.addEventListener('pointerdown',ev=>{ev.preventDefault();set(1);e.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>{set(0);e.classList.remove('on')}))}
bind('gas',v=>gas=v);bind('brk',v=>brk=v);
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='d')gas=1;if(e.key=='ArrowLeft'||e.key=='a')brk=1});
addEventListener('keyup',e=>{if(e.key=='ArrowRight'||e.key=='d')gas=0;if(e.key=='ArrowLeft'||e.key=='a')brk=0});
document.getElementById('go').onclick=()=>{reset();document.getElementById('ov').style.display='none';run=true};
reset();requestAnimationFrame(loop);
</script></body></html>

<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,S,VW,VH;
function rs(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;W=cv.width;H=cv.height;S=Math.min(H/380,W/560);VW=W/S;VH=H/S}
addEventListener('resize',rs);rs();
let R=14,K=500,C=25,ENG=340,MU=1.45,MAXV=620,I=1900,T=0,CI=0,rpm=1000,boost=0,fly=0,AC,eo,eg;
const CARS=[{n:'Rossa',R:14,eng:340,max:620,col:'#e53935',top:'#ef9a9a'},{n:'Jeep 4x4',R:17,eng:400,max:540,col:'#43a047',top:'#a5d6a7'},{n:'Sport',R:13,eng:460,max:820,col:'#1e88e5',top:'#90caf9'},{n:'Monster',R:21,eng:420,max:600,col:'#8e24aa',top:'#ce93d8'},{n:'Ferrari F1',R:14,eng:480,max:900,col:'#dc0000',top:'#ffd700',f:1}],TRK=[{n:'Colline'},{n:'Montagne'},{n:'Discoteca'},{n:'Apple'}],PAL=[{sky:'#bfe8ff',far:'#7fb0cc',dirt:'#7a5230',top:'#4caf50'},{sky:'#ffd9a8',far:'#c98f6a',dirt:'#6b4a3a',top:'#d9a441'},{sky:'#1a0933',far:'#3b1a6b',dirt:'#12082b',top:'#ff2bd6'},{sky:'#1d1d1f',far:'#3a3a3c',dirt:'#2c2c2e',top:'#fff'}];
const TR=[x=>{const a=Math.min(1,Math.max(0,(x-250)/900))*(1+Math.min(x/8000,.8));return 330+a*(45*Math.sin(x/220)+22*Math.sin(x/90+1)+6*Math.sin(x/35+2))},x=>{const a=Math.min(1,Math.max(0,(x-250)/700))*(1+Math.min(x/9000,.6));return 330+a*(52*Math.sin(x/150)+24*Math.sin(x/64+2)+18*Math.abs(Math.sin(x/110)))},x=>{const a=Math.min(1,Math.max(0,(x-250)/700))*(1+Math.min(x/9000,.5));return 330+a*(30*Math.sin(x/260)+22*Math.abs(Math.sin(x/75)))},x=>{const a=Math.min(1,Math.max(0,(x-250)/800))*(1+Math.min(x/9000,.7));return 330+a*(50*Math.sin(x/250)+18*Math.sin(x/105+1))}],hh=x=>330+(TR[T](x*.7)-330)*1.6+Math.min(1,Math.max(0,(x-600)/2000))*7*Math.sin(x/19);

function reset(){const s=CARS[CI];R=s.R;ENG=s.eng;MAXV=s.max;boost=fly=0;c={x:100,y:hh(100)-40,vx:0,vy:0,a:0,w:0};fuel=100;dist=0;cash=0;stall=0;items=[];nextX=500;k=0;camY=c.y-VH*.55}

document.getElementById('t').textContent=msg;document.getElementById('m').innerHTML='Distanza: <b>'+(dist|0)+' m</b> · Monete: <b>'+cash+'</b><br>Record: '+(best|0)+' m';document.getElementById('go').textContent='Riprova';document.getElementById('ov').style.display='flex'}
function step(dt,th,br){
let fx=0,fy=900,tq=0,touch=0;const ca=Math.cos(c.a),sa=Math.sin(c.a);
for(const bx of[-30,30]){const by=16,rx=ca*bx-sa*by,ry=sa*bx+ca*by,px=c.x+rx,py=c.y+ry,p=py+R-hh(px);
if(p>0){touch=1;const sl=(hh(px+1)-hh(px-1))/2,ln=Math.hypot(sl,1),nx=sl/ln,ny=-1/ln,tx=1/ln,ty=sl/ln;
const vx=c.vx-c.w*ry,vy=c.vy+c.w*rx,vn=vx*nx+vy*ny,vt=vx*tx+vy*ty;
const Fn=Math.min(20000,Math.max(0,K*p-C*vn));
let Ft=-.4*vt;if(th&&fuel>0&&vt<MAXV)Ft+=ENG;if(br){if(vt>40)Ft-=10*vt;else if(vt>-MAXV*.5)Ft-=ENG*.8}
Ft=Math.max(-MU*Fn,Math.min(MU*Fn,Ft));
const Fx=Fn*nx+Ft*tx,Fy=Fn*ny+Ft*ty;fx+=Fx;fy+=Fy;tq+=rx*Fy-ry*Fx}}
if(fly>0){fy+=-900+(-250-c.vy)*6;fx+=300;tq+=-(c.a+.2)*9000-c.w*3500}else if(!touch){tq+=(br-(fuel>0?th:0))*8000}
c.vx+=fx*dt;c.vy+=fy*dt;c.w+=tq/I*dt;c.w*=1-.6*dt;
c.x+=c.vx*dt;c.y+=c.vy*dt;c.a+=c.w*dt;
if(c.x<30){c.x=30;c.vx=0}
const hx=c.x+ca*4+sa*26,hy=c.y+sa*4-ca*26;
if(hy>hh(hx)-4)end('Ti sei ribaltato!')}
function after(d){
dist=Math.max(dist,(c.x-100)/10);const g5=Math.min(1,Math.abs(c.vx)/MAXV)*5,fr=g5-Math.min(4,g5|0);rpm+=(1000+(gas&&fuel>0?2200:0)+fr*4500-rpm)*Math.min(1,d*8);if(fly>0){fly-=d;if(fly<=0)boost=0}else{const sp=Math.hypot(c.vx,c.vy);boost=gas&&fuel>0&&sp>MAXV*.85?Math.min(1,boost+d/2.2):Math.max(0,boost-d/1.5);if(boost>=1)fly=3}
if(gas&&fuel>0)fuel-=3.4*d;
while(nextX<c.x+1600){k++;const f=k%9==0;items.push({x:nextX,y:hh(nextX)-35-(f?0:Math.random()*30),f,on:1});nextX+=170+Math.random()*80}
for(const i of items)if(i.on&&Math.hypot(i.x-c.x,i.y-c.y)<34){i.on=0;if(i.f)fuel=Math.min(100,fuel+40);else cash++}
items=items.filter(i=>i.on&&i.x>c.x-600);
if(fuel<=0&&Math.hypot(c.vx,c.vy)<15){stall+=d;if(stall>1.5)end('Carburante esaurito!')}else stall=0}
function draw(){
g.setTransform(1,0,0,1,0,0);g.fillStyle='#8fd3ff';g.fillRect(0,0,W,H);
g.setTransform(S,0,0,S,0,0);
const camX=c.x-VW*.25;camY+=(c.y-VH*.55-camY)*.1;
g.fillStyle=PAL[T].sky;g.fillRect(0,0,VW,VH);if(T==2)disco();if(T==3)apl(VW*.5,VH*.3,Math.min(VW,VH)*.16);
g.fillStyle=PAL[T].far;g.beginPath();g.moveTo(0,VH);for(let x=0;x<=VW+20;x+=20)g.lineTo(x,VH*.6+30*Math.sin((x+camX*.3)/120)-camY*.15);g.lineTo(VW+20,VH);g.fill();
g.fillStyle=PAL[T].dirt;g.beginPath();g.moveTo(0,VH+50);for(let x=-10;x<=VW+10;x+=10)g.lineTo(x,hh(x+camX)-camY);g.lineTo(VW+10,VH+50);g.fill();
const RB=['#61bb46','#fdb827','#f5821f','#e03a3e','#963d97','#009ddc'];for(let q=0;q<(T==3?6:1);q++){g.strokeStyle=T==3?RB[q]:T==2?'hsl('+(performance.now()/8%360|0)+',100%,60%)':PAL[T].top;g.lineWidth=T==3?4:9;g.lineJoin='round';g.beginPath();for(let x=-10;x<=VW+10;x+=10){const y=hh(x+camX)-camY+(T==3?q*4-10:0);x<-5?g.moveTo(x,y):g.lineTo(x,y)}g.stroke()}
for(const i of items){const x=i.x-camX,y=i.y-camY;if(x<-20||x>VW+20)continue;
if(i.f){g.fillStyle='#e53935';g.fillRect(x-8,y-10,16,20);g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText('F',x,y+4)}
else{g.fillStyle='#ffc107';g.beginPath();g.arc(x,y,8,0,7);g.fill();g.strokeStyle='#b8860b';g.lineWidth=2;g.stroke()}}
g.save();g.translate(c.x-camX,c.y-camY);g.rotate(c.a);
g.fillStyle=CARS[CI].col;if(CARS[CI].f){g.fillRect(-40,-2,76,14);g.beginPath();g.moveTo(36,-2);g.lineTo(62,9);g.lineTo(36,12);g.fill();g.fillRect(-38,-10,24,10);g.fillStyle='#111';g.fillRect(-8,-6,20,6);g.fillRect(-48,-22,10,4);g.fillRect(-45,-20,3,12);g.fillRect(50,12,16,4);g.fillStyle='#ffd700';g.beginPath();g.arc(16,6,3,0,7);g.fill()}else{g.fillRect(-38,-8,76,22);g.fillStyle=CARS[CI].top;g.fillRect(-10,-24,28,16)}
g.fillStyle='#ffe0b2';g.beginPath();g.arc(4,CARS[CI].f?-17:-24,7,0,7);g.fill();if(fly>0){g.fillStyle='#ff9800';g.beginPath();g.moveTo(-40,2);g.lineTo(-62-Math.random()*24,8);g.lineTo(-40,14);g.fill();g.fillStyle='#fff';g.fillRect(-8,-4,30,3)}
for(const bx of[-30,30]){g.save();g.translate(bx,16);g.rotate(c.x/R);g.fillStyle='#222';g.beginPath();g.arc(0,0,R,0,7);g.fill();g.fillStyle='#bbb';g.fillRect(-R+3,-1.5,2*R-6,3);g.restore()}
g.restore();
g.textAlign='left';g.fillStyle='#fff';g.font='bold 18px sans-serif';g.shadowColor='#0008';g.shadowBlur=4;
g.fillText((dist|0)+' m',16,28);g.fillText('🪙 '+cash,16,52);
g.shadowBlur=0;g.fillStyle='#0006';g.fillRect(VW-166,14,150,14);g.fillStyle=fuel>25?'#4caf50':'#e53935';g.fillRect(VW-166,14,Math.max(0,fuel)*1.5,14);
g.fillStyle='#fff';g.font='12px sans-serif';g.textAlign='right';g.fillText('CARBURANTE',VW-16,44);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(VW-166,52,150,8);g.fillStyle=fly>0?'#ff9800':'#29b6f6';g.fillRect(VW-166,52,fly>0?fly/3*150:boost*150,8);g.fillStyle='#fff';g.fillText(fly>0?'VOLI!':'TURBO',VW-16,76);const kh=Math.hypot(c.vx,c.vy)*.28;dial(VW/2-52,VH-72,46,kh,240,'km/h',kh|0);dial(VW/2+52,VH-72,46,rpm,8000,'x1000 giri',(rpm/1000).toFixed(1))}
let last=0;
function loop(t){const d=Math.min(.033,(t-last)/1000||0);last=t;if(run){for(let i=0;i<4;i++)if(run)step(d/4,gas,brk);if(run)after(d)}if(AC)snd();draw();requestAnimationFrame(loop)}
function bind(id,set){const e=document.getElementById(id);
e.addEventListener('pointerdown',ev=>{ev.preventDefault();set(1);e.classList.add('on')});
['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,()=>{set(0);e.classList.remove('on')}))}
bind('gas',v=>gas=v);bind('brk',v=>brk=v);
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='d')gas=1;if(e.key=='ArrowLeft'||e.key=='a')brk=1});
addEventListener('keyup',e=>{if(e.key=='ArrowRight'||e.key=='d')gas=0;if(e.key=='ArrowLeft'||e.key=='a')brk=0});
document.getElementById('go').onclick=()=>{aud();reset();document.getElementById('ov').style.display='none';run=true};
function row(id,arr,get,set){const e=document.getElementById(id);e.innerHTML='';arr.forEach((o,i)=>{const b=document.createElement('button');b.className='o'+(get()==i?' s':'');b.textContent=o.n;b.onclick=()=>{set(i);row(id,arr,get,set)};e.appendChild(b)})}
row('cars',CARS,()=>CI,i=>{CI=i;reset()});row('trk',TRK,()=>T,i=>{T=i;reset()});
function dial(x,y,r,v,mx,lb,tx){g.fillStyle='rgba(0,0,0,.55)';g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=3;g.beginPath();g.arc(x,y,r-5,.75*Math.PI,2.25*Math.PI);g.stroke();const a=.75*Math.PI+Math.min(1,v/mx)*1.5*Math.PI;g.strokeStyle='#ff5252';g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*(r-9),y+Math.sin(a)*(r-9));g.stroke();g.fillStyle='#fff';g.textAlign='center';g.font='bold 14px sans-serif';g.fillText(tx,x,y+r*.55);g.font='10px sans-serif';g.fillText(lb,x,y-r*.35)}
function aud(){if(AC){AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();eo=AC.createOscillator();eo.type='sawtooth';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;eg=AC.createGain();eg.gain.value=0;eo.connect(f);f.connect(eg);eg.connect(AC.destination);eo.start();const N=[0,4,7,12,7,4,0,-3,0,4,7,9,7,4,2,-1];let i=0;setInterval(()=>{const t=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type='square';o.frequency.value=262*Math.pow(2,N[i++%16]/12);q.gain.setValueAtTime(.035,t);q.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(q);q.connect(AC.destination);o.start(t);o.stop(t+.25)},230)}catch(e){AC=null}}
function disco(){const t=performance.now()/1000;for(let i=0;i<6;i++){const a=Math.sin(t*1.3+i*1.7)*.5,x0=VW*(i+.5)/6;g.fillStyle='hsla('+((t*60+i*60)%360|0)+',100%,60%,.16)';g.beginPath();g.moveTo(x0-6,0);g.lineTo(x0+6,0);g.lineTo(x0+Math.tan(a)*VH+160,VH);g.lineTo(x0+Math.tan(a)*VH-160,VH);g.fill()}g.fillStyle='#ddd';g.beginPath();g.arc(VW/2,26,16,0,7);g.fill();g.fillStyle='#fff8';for(let i=0;i<5;i++)g.fillRect(VW/2-14+i*6,14+(i*7+(t*9|0))%24,3,3)}
function apl(x,y,s){g.fillStyle='#fff';g.beginPath();g.arc(x-s*.28,y,s*.5,0,7);g.arc(x+s*.28,y,s*.5,0,7);g.fill();g.beginPath();g.ellipse(x+s*.1,y-s*.62,s*.12,s*.22,.6,0,7);g.fill();g.fillStyle=PAL[3].sky;g.beginPath();g.arc(x+s*.62,y-s*.1,s*.2,0,7);g.fill()}
function snd(){const t=AC.currentTime;eo.frequency.setTargetAtTime(40+rpm/45,t,.05);eg.gain.setTargetAtTime(run?(gas?.16:.03):0,t,.08)}
reset();requestAnimationFrame(loop);
</script></body></html>
